[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragguard"
version = "0.1.0"
description = "Small RAG pipeline with abstention and a groundedness guard, plus an evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
api = ["starlette>=0.37", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5", "starlette>=0.37", "httpx>=0.27", "uvicorn>=0.30"]

[project.scripts]
ragguard = "ragguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
